[[rule]]
id = "no-internal-cr-mentions-in-docs"
kind = "forbid-regex"
severity = "error"
include-glob = "docs/**/*.md"
why = "docs/ is shipped, user-facing manual content — a leaked CR-number citation is invisible-to-the-reader internal provenance that breaks the moment the CR store is pruned or renumbered. A cr-NNNNNN-shaped example used purely to illustrate the id format in a usage demo (e.g. `qik nexus promote cr-000006`) is the sole exemption."
message = "cr-NNNNNN reference found in shipped documentation — docs must not cite internal change-request numbers"
suggestion = "Remove the CR-number citation and reword generically. If the CR-id format itself must be shown as a usage example, use a #[qik-cortex allow] inline waiver."
pattern = '(?i)\bcr-\d{6}\b'

ignore = []

[[rule]]
id = "no-internal-cr-mentions-in-python-tests"
kind = "forbid-regex"
severity = "error"
include-glob = "tests/**/*.py"
why = "Python test suites under tests/ are the same engineering-provenance surface as Rust source comments — a regression test's docstring or comment citing the CR number it was written for is invisible provenance that breaks the moment the CR store is pruned or renumbered. Kept as its own rule (distinct from no-internal-cr-mentions-in-code) since tests/ commonly needs literal cr-NNNNNN-shaped fixture values, which deserves its own tailored hint rather than sharing the code rule's wording."
message = "cr-NNNNNN reference found in a Python test file — test code/comments must not cite internal change-request numbers"
suggestion = "Remove the CR-number citation, or reword the test comment generically. A test fixture that must construct a literal cr-NNNNNN-shaped value (e.g. as sample tracker-id input) may use a #[qik-cortex allow] inline waiver."
pattern = '(?i)\bcr-\d{6}\b'

