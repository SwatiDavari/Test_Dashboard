[[rule]]
id = "saf_arc-must-have-incoming-mitigates"
kind = "require-link"
why = "SUPERSEDED: mitigates runs prd_req->saf_req, not saf_req->saf_arc (corrected during qik-thalam-critique review of cr-000141). saf_arc's only requirement is the standard fulfils chain to saf_req (saf_*_arc-must-fulfil). Kept at severity=off rather than deleted, mirroring how the original safety-artifact-must-have-incoming-mitigates stub was retired."
from_type = "^saf_(glob|feat|comp)_arc$"
link = "mitigates"
to_type = "^saf_(glob|feat|comp)_req$"
severity = "off"

[[rule]]
id = "sec_arc-must-have-incoming-mitigates"
kind = "require-link"
why = "SUPERSEDED: mitigates runs prd_req->sec_req, not sec_req->sec_arc (corrected during qik-thalam-critique review of cr-000141). sec_arc's only requirement is the standard fulfils chain to sec_req (sec_*_arc-must-fulfil)."
from_type = "^sec_(glob|feat|comp)_arc$"
link = "mitigates"
to_type = "^sec_(glob|feat|comp)_req$"
severity = "off"

[[rule]]
id = "saf_req-must-have-incoming-mitigates"
kind = "require-link"
why = "Every saf_ requirement (safety requirement, including AoU-shaped ones) must be mitigated by at least one ordinary product requirement — the concrete technical realization that actually addresses the safety concern. Corrected shape per user decision during cr-000141 review: mitigates runs prd_req->saf_req, never saf_req->saf_arc."
from_type = "^saf_(glob|feat|comp)_req$"
link = "mitigates"
to_type = "^prd_(glob|feat|comp)_req$"
severity = "error"

[[rule]]
id = "sec_req-must-have-incoming-mitigates"
kind = "require-link"
why = "Every sec_ requirement (security requirement) must be mitigated by at least one ordinary product requirement — the concrete technical realization that actually addresses the security concern. Same shape as saf_req-must-have-incoming-mitigates."
from_type = "^sec_(glob|feat|comp)_req$"
link = "mitigates"
to_type = "^prd_(glob|feat|comp)_req$"
severity = "error"

[[rule]]
id = "saf_comp-must-belong-to-prd_comp"
kind = "require-link"
why = "A saf_comp scope object is the S-CORE Dependable_Element marker on an existing product component (sys_arc__concept__saf_sec_dependable_element, cr-000141) — it must name which prd_comp it annotates, or the graph cannot answer which product component a given safety analysis concerns."
from_type = "^saf_comp$"
link = "belongs_to"
to_type = "^prd_comp$"
severity = "warning"

[[rule]]
id = "sec_comp-must-belong-to-prd_comp"
kind = "require-link"
why = "A sec_comp scope object is the S-CORE Dependable_Element marker on an existing product component (sys_arc__concept__saf_sec_dependable_element, cr-000141) — it must name which prd_comp it annotates."
from_type = "^sec_comp$"
link = "belongs_to"
to_type = "^prd_comp$"
severity = "warning"

[[rule]]
id = "tst_comp-must-belong-to-prd_comp"
kind = "require-link"
why = "A tst_comp scope object is the structural anchor for one test module, parallel to prd_comp (sys_req__concept__enabler_tst). It must name which prd_comp it tests, or the graph cannot answer which product component a given test module covers."
from_type = "^tst_comp$"
link = "belongs_to"
to_type = "^prd_comp$"
severity = "warning"

[[rule]]
id = "saf_comp_req-must-be-implemented-by-unit_des"
kind = "require-link"
why = "Closes the unit-level traceability gap flagged by qik-thalam-critique: saf_ has no unit scope of its own, relying on the existing prd_unit_des chain (sys_req__concept__saf_enablers, cr-000141) — this rule makes that reliance real instead of merely asserted, mirroring prd_comp_req-must-be-implemented-by-unit_des."
from_type = "^saf_comp_req$"
link = "implements"
to_type = "^prd_unit_des$"
severity = "error"

[[rule]]
id = "sec_comp_req-must-be-implemented-by-unit_des"
kind = "require-link"
why = "Closes the unit-level traceability gap flagged by qik-thalam-critique: sec_ has no unit scope of its own, relying on the existing prd_unit_des chain (sys_req__concept__sec_enablers, cr-000141) — mirrors saf_comp_req-must-be-implemented-by-unit_des."
from_type = "^sec_comp_req$"
link = "implements"
to_type = "^prd_unit_des$"
severity = "error"

[[rule]]
id = "3d-arc-must-not-refine"
kind = "forbid-link"
why = 'Architecture elements (arc) fulfil requirements — they do not refine anything. refines is the requirement/intention chain; fulfils is the architecture chain. Extended to saf_/sec_ (cr-000141) to realize their "peers of prd_/tst_/doc_" claim.'
from_type = "^(prd|tst|doc|saf|sec)_(glob|feat|comp)_arc$|^sys_arc$"
link = "refines"
to_type = ".*"
severity = "error"

[[rule]]
id = "3d-arc-must-not-implement"
kind = "forbid-link"
why = "Architecture elements (arc) are not implemented directly. The implements link runs from unit_imp to unit_des, not from or to architecture. Extended to saf_/sec_ (cr-000141)."
from_type = "^(prd|tst|doc|saf|sec)_(glob|feat|comp)_arc$|^sys_arc$"
link = "implements"
to_type = ".*"
severity = "error"

[[rule]]
id = "3d-req-must-not-fulfil"
kind = "forbid-link"
why = "Requirements (req) derive from higher-level requirements or intentions. The fulfils link goes FROM architecture TO requirements — not from requirements. Extended to saf_/sec_ (cr-000141)."
from_type = "^(prd|tst|doc|saf|sec)_(glob|feat|comp)_req$|^sys_req$"
link = "fulfils"
to_type = ".*"
severity = "error"

[[rule]]
id = "3d-req-must-not-refine-arc"
kind = "forbid-link"
why = "Requirements must derive from intentions or higher-level requirements, never from an architecture element. Extended to saf_/sec_ (cr-000141)."
from_type = "^(prd|tst|doc|saf|sec)_(glob|feat|comp)_req$|^sys_req$"
link = "refines"
to_type = "^(prd|tst|doc|saf|sec)_(glob|feat|comp)_arc$|^sys_arc$"
severity = "error"

[[rule]]
id = "3d-only-tst-may-verify"
kind = "forbid-link"
why = "Only test artifacts (tst_*) may use the verifies link. Product, documentation, safety, security and mission artifacts do not verify — they are verified. Extended to saf_/sec_ (cr-000141)."
from_type = "^(prd|doc|saf|sec|sys)_.*"
link = "verifies"
to_type = ".*"
severity = "error"

[[rule]]
id = "saf_sec-must-not-document"
kind = "forbid-link"
why = "Safety/security artifacts (saf_*/sec_*) do not document anything — documentation is the doc_ enabler's responsibility, mirroring prd-must-not-documents/3d-tst-must-not-document (cr-000141)."
from_type = "^(saf|sec)_.*"
link = "documents"
to_type = ".*"
severity = "error"

[[rule]]
id = "concept-must-not-link-realization"
kind = "forbid-link"
ref = "https://www.iso.org/standard/43139.html"
why = "The concept area is the meta-model qik ships to every adopting project; the realization area is this project own toolsuite. Dependencies point from the instance to the model, never back (ISO/IEC 26550 domain vs. application assets; OMG MOF M2/M1). Omitting link and to_type deliberately: an absent link key makes forbid-link check every link kind, so decomposes and belongs_to authored on the concept side are covered by this one rule."
from_id = "__concept__"
to_id = "__realization__"
severity = "error"

[[rule]]
id = "realization-must-not-belong-to-concept"
kind = "forbid-link"
ref = "https://www.iso.org/standard/43139.html"
why = "belongs_to inverts the semantic direction: authored on the realization side it asserts that a realization node is a part OF the concept, which is the meta-level violation concept-must-not-link-realization cannot see. forbid-link only ever inspects the authored direction, because the *_back mirrors in needs.json never become links during ingest."
from_id = "__realization__"
link = "belongs_to"
to_id = "__concept__"
severity = "error"

[[rule]]
id = "realization-must-not-be-part-of-concept"
kind = "forbid-link"
ref = "https://www.iso.org/standard/43139.html"
why = "Companion to realization-must-not-belong-to-concept: decomposes (cr-000312) goes child→parent; authored on the realization side it asserts that a realization artifact is a constituent part of the concept area, inverting the meta-model hierarchy (ISO/IEC 26550 domain vs. application assets)."
from_id = "__realization__"
link = "decomposes"
to_id = "__concept__"
severity = "error"

[[rule]]
id = "sys-id-area-closed-set"
kind = "require-format"
ref = "https://www.iso.org/standard/81702.html"
why = "Segment 2 of a sys_ id names one of exactly three mission areas: mission (why the system exists — intents only), concept (the artifact-graph meta-model), realization (the toolsuite that realizes it). These are mission areas, not components: no prd_comp__realization__* exists. Kept as its own error-severity rule rather than folded into need-id-naming, which sits at warning — folding it in would silently demote the area constraint to a warning."
from_type = "^sys_"
id_pattern = "^sys_(int|req|arc)__(mission|concept|realization)__[a-z0-9_]+$"
severity = "error"

[[rule]]
id = "sys-arc-must-be-reachable-from-area-root"
kind = "require-reachable"
why = "Every sys_arc node must be reachable from its area's architecture root via decomposes edges. A node not reachable from any root is an isolated architecture element invisible to reviewers — exactly the failure class cr-000295 was opened for."
from_type = "^sys_arc$"
link = "decomposes"
severity = "error"

[[rule]]
id = "bld-glob_int-must-refine-sys"
kind = "require-link"
why = "bld_'s glob_int must trace to the mission-level sys_int, mirroring 3d-glob_int-must-refine-sys (prd_/doc_/tst_ only). bld_'s footprint was completed point-by-point after that rule was written (sys_req__concept__bld_enabler, cr-000405 catalog regen), so it was never added to the shared rule's enabler list. Kept as its own bld-scoped rule rather than editing the existing multi-enabler one, since axon_learn only appends new rules, it does not edit existing ones."
from_type = "^bld_glob_int$"
link = "refines"
to_type = "^sys_int$"
severity = "error"

[[rule]]
id = "bld-glob_req-must-refine-sys"
kind = "require-link"
why = "bld_'s glob_req must trace to mission-level sys_req/sys_int or its own bld_glob_int, mirroring 3d-glob_req-must-refine-sys (prd_/tst_/doc_ only, missing bld_ for the same reason as bld-glob_int-must-refine-sys). Verified against existing bld_glob_req__main__repo_folder_structure, which already refines both bld_glob_int and a sys_req."
from_type = "^bld_glob_req$"
link = "refines"
to_type = "^sys_(req|int)$|^bld_glob_int$"
severity = "error"

[[rule]]
id = "bld-feat_req-must-refine"
kind = "require-link"
why = "bld_'s feat_req must derive from a bld_ global requirement/intention, an umbrella feat_req, or mission-level sys_req/sys_int directly, mirroring 3d-feat_req-must-refine (prd_/tst_/doc_ only). sys_req/sys_int is included here (unlike the generic rule's to_type) because real bld_feat_req instances refine sys_req directly with no bld_-internal peer yet (bld_feat_req__main__install refines only sys_req__realization__install_dogfood_script/install_extension) — matching what the per-enabler *_feat_req-refines-allows rules already permit for prd_/tst_/doc_."
from_type = "^bld_feat_req$"
link = "refines"
to_type = "^bld_glob_req$|^bld_glob_int$|^bld_feat_int$|^bld_feat_req$|^sys_(req|int)$"
severity = "error"

[[rule]]
id = "bld-comp_req-must-refine"
kind = "require-link"
why = "bld_'s comp_req must derive from a bld_ feature requirement, sibling comp_req, or mission-level sys_req/sys_int, mirroring 3d-comp_req-must-refine (prd_/tst_/doc_ only). Verified against all eight existing bld_comp_req instances."
from_type = "^bld_comp_req$"
link = "refines"
to_type = "^bld_feat_req$|^bld_comp_req$|^sys_(req|int)$"
severity = "error"

[[rule]]
id = "bld_unit_imp-must-implement-unit_des"
kind = "require-link"
why = "Every build unit implementation must implement a build unit design. A bld_unit_imp that links to a bld_comp_arc instead inverts the metamodel chain (imp → des → arc, never imp → arc directly)."
from_type = "^bld_unit_imp$"
link = "implements"
to_type = "^bld_unit_des$"
from_status = ["released", "deprecated"]
severity = "error"

[[rule]]
id = "bld_unit_imp-implements-allows"
kind = "allows-link"
why = "Build unit implementations may only implement build unit designs."
from_type = "^bld_unit_imp$"
link = "implements"
to_type = "^bld_unit_des$"
from_status = ["released", "deprecated"]
severity = "error"

[[rule]]
id = "no-bare-tag-in-body"
kind = "forbid-regex-in-body"
why = "cr-000444: an unquoted need-id-shaped string written directly into a need's body prose is invisible to every other check - axon check validates only declared link fields, never body content. Real instance: a since-deleted feature-architecture node was cited four times in running prose and never existed. Hard error from approved status onward - a baselined-or-shipped need has no excuse for an untracked bare mention. No citation/quoting exemption of any kind - the rule matches content_pattern against raw content unconditionally, so every existing backtick-wrapped mention across the corpus counts too: measured at 499 errors (approved+) and 226 warnings (draft/proposed) once the citation exemption was removed as a deliberate simplification (a bespoke quoting parser was judged more fragile than the debt it hides)."
content_pattern = '\b(sys_(int|req|arc)|(prd|saf|sec|tst|doc|bld)_(glob|feat|comp|unit)_(int|req|arc|des|imp)|(prd|tst|doc|saf|sec|bld)_comp)__[a-z][a-z0-9_]+__[a-z0-9_]+\b'
from_status = ["approved", "released", "deprecated"]
severity = "error"

[[rule]]
id = "no-bare-tag-in-body-proposed"
kind = "forbid-regex-in-body"
why = "cr-000444: same as no-bare-tag-in-body, but a need still at draft/proposed is under active authoring - a bare mention there is a warning to fix before advancing, not yet a hard blocker."
content_pattern = '\b(sys_(int|req|arc)|(prd|saf|sec|tst|doc|bld)_(glob|feat|comp|unit)_(int|req|arc|des|imp)|(prd|tst|doc|saf|sec|bld)_comp)__[a-z][a-z0-9_]+__[a-z0-9_]+\b'
from_status = ["none", "draft", "proposed"]
severity = "warning"

