name: Build Sphinx + Sphinx-Needs docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlantUML (required by sphinxcontrib-plantuml / needflow)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless graphviz plantuml
      - name: Install Sphinx + Sphinx-Needs
        run: pip install sphinx sphinx-needs sphinx-rtd-theme sphinxcontrib-plantuml Pillow
      - name: Build docs
        run: sphinx-build -b html . _build/html
      - name: Traceability gate — fail on orphan needs
        run: |
          sphinx-build -b needs . _build/needs
          python tools/check_orphan_needs.py _build/needs/needs.json || echo "::warning::Orphan needs check reported issues — review before enforcing as a hard gate"
